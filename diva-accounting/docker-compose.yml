version: '3.8'
services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:9000"
    env_file:
      - ./backend/.env
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: diva_accounting
    ports:
      - "3306:3306"
